name: Verification
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install ruff==0.15.0 mypy==1.19.0 numpy==2.4.2 scipy==1.17.1
      - run: ruff check patient_outreach tests scripts
      - run: mypy patient_outreach scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q patient_outreach tests
      - run: python scripts/verify_source.py
      - run: python scripts/export_haryana.py --check
      - working-directory: web
        run: npm ci --ignore-scripts
      - working-directory: web
        run: npm test
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npm run release:check
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npm run test:browser -- --project=chromium
